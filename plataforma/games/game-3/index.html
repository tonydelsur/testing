<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Cosmic Sweeper — Fase 11 (Playlist Dinámica)</title>

  <style>
    /* ============================================================
       RESET MOBILE-FIRST (REGLAS INQUEBRANTABLES)
       ============================================================ */
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #0b0914;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #gameCanvas {
      position: fixed;
      top: 0;
      left: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    /* ============================================================
       HUD SUPERIOR
       ============================================================ */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 10vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5vw;
      box-sizing: border-box;
      z-index: 10;
      pointer-events: none;
    }

    #mineCounter {
      color: #ffea00;
      font-family: "Courier New", "Lucida Console", monospace;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 10px #ffea00;
      letter-spacing: 1px;
    }

    /* Contenedor flex de los botones del HUD (alineados a la derecha) */
    #hudButtons {
      display: flex;
      align-items: center;
    }

    /* Botón de música (Fase 11) — mismo estilo neón que restartBtn */
    #musicBtn {
      background: transparent;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      font-family: inherit;
      font-weight: bold;
      font-size: 1rem;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      margin-right: 10px;
      box-shadow:
        0 0 10px #00f0ff inset,
        0 0 10px #00f0ff;
      text-shadow: 0 0 5px #00f0ff;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }

    #musicBtn:active {
      transform: scale(0.95);
      box-shadow:
        0 0 14px #00f0ff inset,
        0 0 16px #00f0ff;
    }

    /* Botón de reinicio */
    #restartBtn {
      background: transparent;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      font-family: inherit;
      font-weight: bold;
      font-size: 1rem;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      box-shadow:
        0 0 10px #00f0ff inset,
        0 0 10px #00f0ff;
      text-shadow: 0 0 5px #00f0ff;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }

    #restartBtn:active {
      transform: scale(0.95);
      box-shadow:
        0 0 14px #00f0ff inset,
        0 0 16px #00f0ff;
    }
  </style>
</head>

<body>
  <div id="hud">
    <div id="mineCounter">🚩 0</div>
    <div id="hudButtons">
      <button id="musicBtn" type="button">🎵 ON</button>
      <button id="restartBtn" type="button">↻ Reiniciar</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    (function () {
      'use strict';

      /* ============================================================
         1. PALETA DE DISEÑO "DEEP SPACE CANDY" + A11y
         ============================================================ */
      const PALETTE = {
        background:    '#0b0914',
        safe:          '#00f0ff',
        virus:         '#ff007f',
        ui:            '#ffea00',
        hidden:        '#1a1a2e',
        textHighlight: '#ffffff'  // A11y: blanco puro para máximo contraste
      };

      /* ============================================================
         2. FASE 11 — PLAYLIST DINÁMICA DE MÚSICA DE FONDO
         - Ambas pistas viven en la misma ruta que este index.html.
         - La pista activa se reproduce en loop a volumen moderado.
         - `changeTrack()` avanza al siguiente track de la lista
           (rotación circular) y solo reproduce si el jugador ya
           interactuó con el juego (autoplay policy).
         - `isMuted` es un toggle independiente del track activo.
         ============================================================ */
      const TRACKS = ['music.mp3', 'music2.mp3'];
      let currentTrackIndex = 0;
      let isMuted = false;

      const bgMusic = new Audio(TRACKS[currentTrackIndex]);
      bgMusic.loop = true;
      bgMusic.volume = 0.5;

      /**
       * Avanza al siguiente track de la playlist.
       * Pausa la pista actual, actualiza la fuente y, si el jugador
       * ya interactuó previamente, reanuda la reproducción.
       */
      function changeTrack() {
        bgMusic.pause();
        currentTrackIndex = (currentTrackIndex + 1) % TRACKS.length;
        bgMusic.src = TRACKS[currentTrackIndex];
        if (gameState.hasInteracted) {
          bgMusic.play().catch(e => {});
        }
      }

      /* ============================================================
         3. PROGRESIÓN DE NIVELES
         ============================================================ */
      const LEVELS = [
        { rows: 10, cols: 8,  virusCount: 10 },
        { rows: 14, cols: 10, virusCount: 22 },
        { rows: 18, cols: 12, virusCount: 40 }
      ];

      /* ============================================================
         4. ZONAS SEGURAS
         ============================================================ */
      const SAFE_ZONE_TOP_RATIO    = 0.10;
      const SAFE_ZONE_BOTTOM_RATIO = 0.15;
      const PLAY_AREA_RATIO =
        1 - SAFE_ZONE_BOTTOM_RATIO - SAFE_ZONE_TOP_RATIO; // 0.75

      const PLANET_RADIUS_RATIO = 0.42;
      const LONG_PRESS_MS = 400;
      const MOVE_CANCEL_PX = 10;
      const PARTICLE_COUNT = 40;
      const PARTICLE_MAX_LIFE_MS = 800;
      const CAMERA_SHAKE_PX = 4;
      const OVERLAY_BG = 'rgba(11, 9, 20, 0.7)';
      const FONT_FAMILY =
        '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

      /* ============================================================
         5. REFERENCIAS AL DOM Y CONTEXTO
         ============================================================ */
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d', {
        alpha: false,
        desynchronized: true
      });

      const hudMineCounter = document.getElementById('mineCounter');
      const restartBtn = document.getElementById('restartBtn');
      const musicBtn = document.getElementById('musicBtn');

      const viewport = { width: 0, height: 0 };

      /* ============================================================
         6. MOTOR DE AUDIO PROCEDURAL (Web Audio API) — SFX
         ============================================================ */
      const soundManager = {
        ctx: null,
        masterGain: null,
        musicStarted: false,
        musicNodes: null,

        init() {
          if (this.ctx) return;
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) {
            console.warn('[CosmicSweeper] Web Audio API no disponible.');
            return;
          }
          try {
            this.ctx = new AC();
            if (this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.55;
            this.masterGain.connect(this.ctx.destination);
            this.startMusic();
          } catch (err) {
            console.warn('[CosmicSweeper] Error al crear AudioContext:', err);
          }
        },

        startMusic() {
          if (this.musicStarted || !this.ctx) return;
          this.musicStarted = true;

          const now = this.ctx.currentTime;

          const droneLow = this.ctx.createOscillator();
          droneLow.type = 'sine';
          droneLow.frequency.value = 55;

          const droneHigh = this.ctx.createOscillator();
          droneHigh.type = 'sine';
          droneHigh.frequency.value = 82.5;

          const droneGain = this.ctx.createGain();
          droneGain.gain.value = 0.06;

          const lfo = this.ctx.createOscillator();
          lfo.type = 'sine';
          lfo.frequency.value = 0.12;

          const lfoGain = this.ctx.createGain();
          lfoGain.gain.value = 0.035;

          lfo.connect(lfoGain);
          lfoGain.connect(droneGain.gain);

          droneLow.connect(droneGain);
          droneHigh.connect(droneGain);
          droneGain.connect(this.masterGain);

          droneLow.start(now);
          droneHigh.start(now);
          lfo.start(now);

          this.musicNodes = { droneLow, droneHigh, lfo, droneGain, lfoGain };
        },

        _beep(startTime, freq, duration, type, volume) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.value = freq;

          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(volume, startTime + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(startTime);
          osc.stop(startTime + duration + 0.03);
        },

        playReveal() {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(620, now);
          osc.frequency.exponentialRampToValueAtTime(940, now + 0.08);

          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.16, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.1);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(now);
          osc.stop(now + 0.13);
        },

        playFlag() {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          this._beep(now,          780, 0.055, 'triangle', 0.14);
          this._beep(now + 0.075, 1020, 0.055, 'triangle', 0.14);
        },

        playExplosion() {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const dur = 0.8;

          const osc = this.ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(10, now + dur);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.42, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(now);
          osc.stop(now + dur + 0.05);
        },

        playWin() {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          for (let i = 0; i < notes.length; i++) {
            this._beep(now + i * 0.09, notes[i], 0.2, 'sine', 0.17);
          }
        }
      };

      /* ============================================================
         7. ESTADO GLOBAL DEL JUEGO
         ============================================================ */
      const gameState = {
        phase: 'BOOT',
        running: false,
        elapsed: 0,
        frameCount: 0,
        hasInteracted: false,
        currentLevelIndex: 0,
        grid: null,
        layout: null,
        particles: []
      };

      /* ============================================================
         8. STUB DE MONETIZACIÓN
         ============================================================ */
      window.refreshAd = function () {
        console.log('[CosmicSweeper] refreshAd() — stub de monetización');
      };

      /* ============================================================
         9. MOTOR LÓGICO (REGLA 1)
         ============================================================ */
      function createEmptyGrid(rows, cols) {
        const grid = new Array(rows);
        for (let r = 0; r < rows; r++) {
          const row = new Array(cols);
          for (let c = 0; c < cols; c++) {
            row[c] = {
              isVirus: false,
              isRevealed: false,
              isFlagged: false,
              adjacentVirusCount: 0
            };
          }
          grid[r] = row;
        }
        return grid;
      }

      function placeViruses(grid, virusCount) {
        const rows = grid.length;
        const cols = grid[0].length;
        const total = rows * cols;

        if (virusCount < 0 || virusCount > total) {
          throw new Error(
            `[CosmicSweeper] virusCount (${virusCount}) fuera de rango [0, ${total}].`
          );
        }

        const indices = new Uint32Array(total);
        for (let i = 0; i < total; i++) indices[i] = i;

        for (let i = 0; i < virusCount; i++) {
          const j = i + Math.floor(Math.random() * (total - i));
          const tmp = indices[i];
          indices[i] = indices[j];
          indices[j] = tmp;

          const idx = indices[i];
          const r = (idx / cols) | 0;
          const c = idx % cols;
          grid[r][c].isVirus = true;
        }
      }

      function calculateAdjacencyCounts(grid) {
        const rows = grid.length;
        const cols = grid[0].length;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const cell = grid[r][c];
            if (cell.isVirus) continue;

            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                  if (grid[nr][nc].isVirus) count++;
                }
              }
            }
            cell.adjacentVirusCount = count;
          }
        }
      }

      function initializeLevel(rows, cols, virusCount) {
        const grid = createEmptyGrid(rows, cols);
        placeViruses(grid, virusCount);
        calculateAdjacencyCounts(grid);

        updateHUD();
        return grid;
      }

      function countViruses(grid) {
        let n = 0;
        for (let r = 0; r < grid.length; r++) {
          for (let c = 0; c < grid[r].length; c++) {
            if (grid[r][c].isVirus) n++;
          }
        }
        return n;
      }

      function countRevealed(grid) {
        let n = 0;
        for (let r = 0; r < grid.length; r++) {
          for (let c = 0; c < grid[r].length; c++) {
            if (grid[r][c].isRevealed) n++;
          }
        }
        return n;
      }

      function countFlags(grid) {
        const g = grid || gameState.grid;
        if (!g) return 0;
        let n = 0;
        for (let r = 0; r < g.length; r++) {
          for (let c = 0; c < g[r].length; c++) {
            if (g[r][c].isFlagged) n++;
          }
        }
        return n;
      }

      /* ============================================================
         10. HUD — CONTADOR DE VIRUS RESTANTES
         ============================================================ */
      function updateHUD() {
        if (!hudMineCounter) return;
        const grid = gameState.grid;
        if (!grid) {
          hudMineCounter.innerHTML = '🚩 0';
          return;
        }
        const flags = countFlags(grid);
        const virusCount = LEVELS[gameState.currentLevelIndex].virusCount;
        hudMineCounter.innerHTML = '🚩 ' + (virusCount - flags);
      }

      /* ============================================================
         11. CONDICIÓN DE VICTORIA
         ============================================================ */
      function checkWinCondition() {
        const grid = gameState.grid;
        if (!grid) return false;

        const rows = grid.length;
        const cols = grid[0].length;
        const virusCount = LEVELS[gameState.currentLevelIndex].virusCount;
        const target = rows * cols - virusCount;

        if (countRevealed(grid) === target) {
          gameState.phase = 'LEVEL_TRANSITION';

          // Fase 11: rotar la pista al pasar a transición de nivel.
          changeTrack();

          soundManager.playWin();
          window.refreshAd();
          console.log('✨ NIVEL SUPERADO ✨');
          return true;
        }
        return false;
      }

      /* ============================================================
         12. RESET / TRANSICIÓN DE NIVEL
         El BGM cambia de pista, pero nunca se DUPLICA.
         ============================================================ */
      function resetGame() {
        const prevPhase = gameState.phase;

        if (prevPhase === 'LEVEL_TRANSITION') {
          gameState.currentLevelIndex = Math.min(
            gameState.currentLevelIndex + 1,
            LEVELS.length - 1
          );
        }

        gameState.particles = [];

        // Fase 11: rotar la pista al reiniciar.
        changeTrack();

        const cfg = LEVELS[gameState.currentLevelIndex];
        gameState.grid = initializeLevel(cfg.rows, cfg.cols, cfg.virusCount);

        calculateLayout();
        updateHUD();

        gameState.phase = 'READY';
        gameState.hasInteracted = false;

        console.log(
          `%c[CosmicSweeper] Nivel ${gameState.currentLevelIndex + 1}/${LEVELS.length} — ${cfg.rows}x${cfg.cols} | virus: ${cfg.virusCount}`,
          'color:#00f0ff;font-weight:bold;'
        );
      }

      /* ============================================================
         13. LAYOUT RESPONSIVO (REGLA 3 + ZONA SUPERIOR HUD)
         ============================================================ */
      function calculateLayout() {
        const grid = gameState.grid;
        if (!grid) {
          gameState.layout = null;
          return;
        }

        const rows = grid.length;
        const cols = grid[0].length;
        const playAreaHeight = viewport.height * PLAY_AREA_RATIO;

        const cellSize = Math.min(viewport.width / cols, playAreaHeight / rows);
        const planetRadius = cellSize * PLANET_RADIUS_RATIO;

        const gridWidth = cols * cellSize;
        const gridHeight = rows * cellSize;

        const offsetX = (viewport.width - gridWidth) * 0.5;
        const offsetY =
          (viewport.height * SAFE_ZONE_TOP_RATIO) +
          (playAreaHeight - gridHeight) * 0.5;

        gameState.layout = {
          rows,
          cols,
          cellSize,
          planetRadius,
          offsetX,
          offsetY,
          playAreaHeight
        };
      }

      /* ============================================================
         14. TRADUCCIÓN ESPACIAL (REGLA 3)
         ============================================================ */
      function getGridCoordinates(pixelX, pixelY) {
        const layout = gameState.layout;
        if (!layout) return null;

        const { offsetX, offsetY, cellSize, rows, cols } = layout;

        const localX = pixelX - offsetX;
        const localY = pixelY - offsetY;

        if (localX < 0 || localY < 0) return null;

        const c = Math.floor(localX / cellSize);
        const r = Math.floor(localY / cellSize);

        if (r < 0 || r >= rows || c < 0 || c >= cols) return null;

        return { r, c };
      }

      /* ============================================================
         15. FLOOD FILL ITERATIVO (REGLA 2)
         ============================================================ */
      function floodFill(startR, startC) {
        const grid = gameState.grid;
        const rows = grid.length;
        const cols = grid[0].length;

        const stack = [{ r: startR, c: startC }];

        while (stack.length > 0) {
          const node = stack.pop();
          const r = node.r;
          const c = node.c;

          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;

              const nr = r + dr;
              const nc = c + dc;

              if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;

              const neighbor = grid[nr][nc];
              if (neighbor.isVirus) continue;
              if (neighbor.isRevealed) continue;
              if (neighbor.isFlagged) continue;

              neighbor.isRevealed = true;

              if (neighbor.adjacentVirusCount === 0) {
                stack.push({ r: nr, c: nc });
              }
            }
          }
        }
      }

      /* ============================================================
         16. SISTEMA DE PARTÍCULAS — SPAWN
         ============================================================ */
      function spawnExplosion(cx, cy) {
        const particles = gameState.particles;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.15 + Math.random() * 0.25;
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: PARTICLE_MAX_LIFE_MS,
            maxLife: PARTICLE_MAX_LIFE_MS,
            radius: 1.5 + Math.random() * 1.5
          });
        }
      }

      /* ============================================================
         17. MANEJADORES DE ACCIÓN
         ============================================================ */

      function handlePrimaryAction(r, c) {
        if (
          gameState.phase === 'GAME_OVER' ||
          gameState.phase === 'LEVEL_TRANSITION'
        ) {
          return;
        }

        const cell = gameState.grid[r][c];

        if (cell.isRevealed || cell.isFlagged) return;

        // Primera interacción válida: arrancar audio (SFX + bgMusic).
        if (!gameState.hasInteracted) {
          gameState.hasInteracted = true;
          soundManager.init();
          bgMusic.play().catch(e => console.log('Audio autoplay bloqueado:', e));
        }

        cell.isRevealed = true;

        // --- DERROTA ---
        if (cell.isVirus) {
          const layout = gameState.layout;
          if (layout) {
            const half = layout.cellSize * 0.5;
            const cx = layout.offsetX + c * layout.cellSize + half;
            const cy = layout.offsetY + r * layout.cellSize + half;
            spawnExplosion(cx, cy);
          }

          soundManager.playExplosion();

          gameState.phase = 'GAME_OVER';

          // Fase 11: rotar la pista al detonar un virus.
          changeTrack();

          const grid = gameState.grid;
          for (let rr = 0; rr < grid.length; rr++) {
            for (let cc = 0; cc < grid[rr].length; cc++) {
              if (grid[rr][cc].isVirus) {
                grid[rr][cc].isRevealed = true;
              }
            }
          }

          window.refreshAd();
          console.log('💥 GAME OVER 💥');
          return;
        }

        soundManager.playReveal();

        if (cell.adjacentVirusCount === 0) {
          floodFill(r, c);
        }

        checkWinCondition();
      }

      function handleSecondaryAction(r, c) {
        if (
          gameState.phase === 'GAME_OVER' ||
          gameState.phase === 'LEVEL_TRANSITION'
        ) {
          return;
        }

        const cell = gameState.grid[r][c];
        if (cell.isRevealed) return;

        // Límite de banderas: solo bloquea al INTENTAR AÑADIR
        if (!cell.isFlagged) {
          const virusCount = LEVELS[gameState.currentLevelIndex].virusCount;
          if (countFlags(gameState.grid) >= virusCount) {
            return;
          }
        }

        // Primera interacción válida: arrancar audio.
        if (!gameState.hasInteracted) {
          gameState.hasInteracted = true;
          soundManager.init();
          bgMusic.play().catch(e => console.log('Audio autoplay bloqueado:', e));
        }

        cell.isFlagged = !cell.isFlagged;

        soundManager.playFlag();
        updateHUD();
      }

      /* ============================================================
         18. ADMINISTRADOR DE INPUTS HÍBRIDO
         ============================================================ */
      const inputState = {
        lastX: 0,
        lastY: 0,
        touchActive: false,
        touchStartX: 0,
        touchStartY: 0,
        longPressTimer: null,
        longPressFired: false
      };

      function isEndPhase() {
        return (
          gameState.phase === 'GAME_OVER' ||
          gameState.phase === 'LEVEL_TRANSITION'
        );
      }

      canvas.addEventListener('mousedown', function (e) {
        if (e.button === 0 && isEndPhase()) {
          e.preventDefault();
          resetGame();
          return;
        }

        inputState.lastX = e.clientX;
        inputState.lastY = e.clientY;

        if (e.button === 0) {
          const coords = getGridCoordinates(e.clientX, e.clientY);
          if (coords) handlePrimaryAction(coords.r, coords.c);
        } else if (e.button === 2) {
          e.preventDefault();
          const coords = getGridCoordinates(e.clientX, e.clientY);
          if (coords) handleSecondaryAction(coords.r, coords.c);
        }
      });

      canvas.addEventListener('mousemove', function (e) {
        inputState.lastX = e.clientX;
        inputState.lastY = e.clientY;
      });

      canvas.addEventListener('touchstart', function (e) {
        e.preventDefault();

        if (isEndPhase()) {
          resetGame();
          return;
        }

        if (inputState.touchActive) return;

        const touch = e.changedTouches[0];
        inputState.touchActive = true;
        inputState.touchStartX = touch.clientX;
        inputState.touchStartY = touch.clientY;
        inputState.lastX = touch.clientX;
        inputState.lastY = touch.clientY;
        inputState.longPressFired = false;

        const coords = getGridCoordinates(touch.clientX, touch.clientY);

        inputState.longPressTimer = setTimeout(function () {
          inputState.longPressTimer = null;
          if (!inputState.touchActive) return;
          inputState.longPressFired = true;
          if (coords) handleSecondaryAction(coords.r, coords.c);
        }, LONG_PRESS_MS);
      }, { passive: false });

      canvas.addEventListener('touchmove', function (e) {
        e.preventDefault();
        if (!inputState.touchActive) return;

        const touch = e.changedTouches[0];
        inputState.lastX = touch.clientX;
        inputState.lastY = touch.clientY;

        const dx = touch.clientX - inputState.touchStartX;
        const dy = touch.clientY - inputState.touchStartY;

        if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) {
          if (inputState.longPressTimer !== null) {
            clearTimeout(inputState.longPressTimer);
            inputState.longPressTimer = null;
          }
          inputState.touchActive = false;
        }
      }, { passive: false });

      canvas.addEventListener('touchend', function (e) {
        e.preventDefault();

        if (!inputState.touchActive) {
          if (inputState.longPressTimer !== null) {
            clearTimeout(inputState.longPressTimer);
            inputState.longPressTimer = null;
          }
          inputState.longPressFired = false;
          return;
        }

        const wasLongPress = inputState.longPressFired;

        if (inputState.longPressTimer !== null) {
          clearTimeout(inputState.longPressTimer);
          inputState.longPressTimer = null;
        }

        inputState.touchActive = false;
        inputState.longPressFired = false;

        if (!wasLongPress) {
          const touch = e.changedTouches[0];
          const coords = getGridCoordinates(touch.clientX, touch.clientY);
          if (coords) handlePrimaryAction(coords.r, coords.c);
        }
      }, { passive: false });

      window.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.key === ' ') {
          e.preventDefault();
          if (e.repeat) return;

          if (isEndPhase()) {
            resetGame();
            return;
          }

          const coords = getGridCoordinates(inputState.lastX, inputState.lastY);
          if (coords) handleSecondaryAction(coords.r, coords.c);
        }
      });

      window.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });

      /* ============================================================
         19. BOTÓN DE REINICIO
         ============================================================ */
      if (restartBtn) {
        restartBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          gameState.phase = 'READY';
          resetGame();
        });

        restartBtn.addEventListener('touchstart', function (e) {
          e.stopPropagation();
        }, { passive: true });
      }

      /* ============================================================
         20. BOTÓN DE MÚSICA (Fase 11) — Toggle de muteo
         ============================================================ */
      if (musicBtn) {
        musicBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          isMuted = !isMuted;
          bgMusic.muted = isMuted;
          musicBtn.textContent = isMuted ? '🔇 OFF' : '🎵 ON';
        });

        musicBtn.addEventListener('touchstart', function (e) {
          e.stopPropagation();
        }, { passive: true });
      }

      /* ============================================================
         21. INICIALIZACIÓN Y REDIMENSIONADO
         ============================================================ */
      function resizeCanvas() {
        viewport.width = window.innerWidth;
        viewport.height = window.innerHeight;

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';

        calculateLayout();

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';

        render();
      }

      /* ============================================================
         22. UPDATE
         ============================================================ */
      function update(deltaMs) {
        gameState.elapsed += deltaMs;
        gameState.frameCount++;

        const particles = gameState.particles;
        if (particles.length > 0) {
          const friction = Math.pow(0.94, deltaMs / 16.6667);

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];

            p.x += p.vx * deltaMs;
            p.y += p.vy * deltaMs;
            p.vx *= friction;
            p.vy *= friction;
            p.life -= deltaMs;

            if (p.life <= 0) {
              particles.splice(i, 1);
            }
          }
        }
      }

      /* ============================================================
         23. RENDER
         ============================================================ */
      function render() {
        ctx.save();

        let shakeApplied = false;
        if (gameState.phase === 'GAME_OVER') {
          const dx = (Math.random() * 2 - 1) * CAMERA_SHAKE_PX;
          const dy = (Math.random() * 2 - 1) * CAMERA_SHAKE_PX;
          ctx.translate(dx, dy);
          shakeApplied = true;
        }

        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = PALETTE.background;
        if (shakeApplied) {
          ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);
        } else {
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        const layout = gameState.layout;
        const grid = gameState.grid;
        if (!layout || !grid) {
          ctx.restore();
          return;
        }

        const { rows, cols, cellSize, planetRadius, offsetX, offsetY } = layout;
        const half = cellSize * 0.5;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // ---- PASO 0: PLANETAS OCULTOS ----
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = PALETTE.hidden;
        for (let r = 0; r < rows; r++) {
          const row = grid[r];
          const cy = offsetY + r * cellSize + half;
          for (let c = 0; c < cols; c++) {
            const cell = row[c];
            if (cell.isRevealed) continue;
            const cx = offsetX + c * cellSize + half;
            ctx.beginPath();
            ctx.arc(cx, cy, planetRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // ---- PASO 1: VIRUS REVELADOS ----
        ctx.shadowBlur = 15;
        ctx.shadowColor = PALETTE.virus;
        ctx.fillStyle = PALETTE.virus;
        for (let r = 0; r < rows; r++) {
          const row = grid[r];
          const cy = offsetY + r * cellSize + half;
          for (let c = 0; c < cols; c++) {
            const cell = row[c];
            if (!cell.isVirus || !cell.isRevealed) continue;

            const cx = offsetX + c * cellSize + half;
            ctx.beginPath();
            ctx.arc(cx, cy, planetRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // ---- PASO 2: PLANETAS SEGUROS REVELADOS ----
        ctx.shadowColor = PALETTE.safe;
        ctx.fillStyle = PALETTE.safe;
        for (let r = 0; r < rows; r++) {
          const row = grid[r];
          const cy = offsetY + r * cellSize + half;
          for (let c = 0; c < cols; c++) {
            const cell = row[c];
            if (cell.isVirus || !cell.isRevealed) continue;

            const cx = offsetX + c * cellSize + half;
            ctx.beginPath();
            ctx.arc(cx, cy, planetRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // ---- PASO 3: NÚMEROS DE ADYACENCIA (A11y) ----
        ctx.shadowColor = PALETTE.ui;
        ctx.fillStyle = PALETTE.textHighlight;
        ctx.strokeStyle = PALETTE.background;
        ctx.lineWidth = Math.max(3, planetRadius * 0.15);
        ctx.lineJoin = 'round';

        const numFontSize = Math.max(10, Math.round(planetRadius * 0.95));
        ctx.font =
          'bold ' + numFontSize + 'px "Courier New", "Lucida Console", monospace';

        for (let r = 0; r < rows; r++) {
          const row = grid[r];
          const cy = offsetY + r * cellSize + half;
          for (let c = 0; c < cols; c++) {
            const cell = row[c];
            if (cell.isVirus || !cell.isRevealed) continue;
            if (cell.adjacentVirusCount === 0) continue;

            const cx = offsetX + c * cellSize + half;
            ctx.strokeText(String(cell.adjacentVirusCount), cx, cy);
            ctx.fillText(String(cell.adjacentVirusCount), cx, cy);
          }
        }

        // ---- PASO 4: BANDERAS (palpitación) ----
        ctx.shadowBlur = 15;
        ctx.shadowColor = PALETTE.ui;
        ctx.fillStyle = PALETTE.ui;

        const pulse = Math.sin(Date.now() / 150);
        const flagRatio = 0.3 + 0.1 * pulse;

        for (let r = 0; r < rows; r++) {
          const row = grid[r];
          const cy = offsetY + r * cellSize + half;
          for (let c = 0; c < cols; c++) {
            const cell = row[c];
            if (cell.isRevealed || !cell.isFlagged) continue;

            const cx = offsetX + c * cellSize + half;
            const flagRadius = planetRadius * flagRatio;

            ctx.beginPath();
            ctx.arc(cx, cy, flagRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // ---- PASO 5: PARTÍCULAS ----
        const particles = gameState.particles;
        if (particles.length > 0) {
          ctx.shadowBlur = 15;
          ctx.shadowColor = PALETTE.virus;
          ctx.fillStyle = PALETTE.virus;

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            const alpha = p.life / p.maxLife;
            ctx.globalAlpha = alpha > 0 ? alpha : 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        // ---- PASO 6: TUTORIAL ----
        if (!gameState.hasInteracted) {
          drawTutorial();
        }

        // ---- PASO 7: OVERLAY DE FIN DE PARTIDA ----
        drawEndOverlay();

        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
        ctx.restore();
      }

      /* ============================================================
         23.1 TUTORIAL DE UI
         ============================================================ */
      function drawTutorial() {
        const line1 = 'PC: Clic Izquierdo (Descubrir) - Clic Derecho (Bandera)';
        const line2 = 'MÓVIL: Tap (Descubrir) - Mantener presionado (Bandera)';

        const safeCenterY =
          viewport.height * (1 - SAFE_ZONE_BOTTOM_RATIO * 0.5);

        const maxWidth = viewport.width * 0.92;
        let fontSize = 13;

        ctx.font = 'bold ' + fontSize + 'px ' + FONT_FAMILY;

        const w1 = ctx.measureText(line1).width;
        const w2 = ctx.measureText(line2).width;
        const widest = Math.max(w1, w2);

        if (widest > maxWidth) {
          fontSize = fontSize * (maxWidth / widest);
          if (fontSize < 8) fontSize = 8;
          ctx.font = 'bold ' + fontSize + 'px ' + FONT_FAMILY;
        }

        const lineHeight = fontSize * 1.45;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.shadowBlur = 15;
        ctx.shadowColor = PALETTE.ui;
        ctx.fillStyle = PALETTE.ui;

        ctx.fillText(line1, viewport.width * 0.5, safeCenterY - lineHeight * 0.5);
        ctx.fillText(line2, viewport.width * 0.5, safeCenterY + lineHeight * 0.5);
      }

      /* ============================================================
         23.2 OVERLAY FIN DE PARTIDA
         ============================================================ */
      function drawEndOverlay() {
        const isLose = gameState.phase === 'GAME_OVER';
        const isWin = gameState.phase === 'LEVEL_TRANSITION';
        if (!isLose && !isWin) return;

        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = OVERLAY_BG;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width * 0.5;
        const centerY = canvas.height * 0.5;

        const base = Math.min(canvas.width, canvas.height);
        const bigSize = Math.round(base * 0.10);
        const smallSize = Math.round(base * 0.035);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const titleColor = isWin ? PALETTE.safe : PALETTE.virus;
        const titleText = isWin ? '¡ZONA SEGURA!' : 'GAME OVER';

        ctx.shadowBlur = 15;
        ctx.shadowColor = titleColor;
        ctx.fillStyle = titleColor;
        ctx.font = 'bold ' + bigSize + 'px ' + FONT_FAMILY;
        ctx.fillText(titleText, centerX, centerY - smallSize * 0.8);

        let subText;
        if (isWin) {
          const nextIndex = Math.min(
            gameState.currentLevelIndex + 1,
            LEVELS.length - 1
          );
          subText = 'Toca para el Nivel ' + (nextIndex + 1);
        } else {
          subText = 'Toca para reintentar';
        }

        ctx.shadowColor = PALETTE.ui;
        ctx.fillStyle = PALETTE.ui;
        ctx.font = 'bold ' + smallSize + 'px ' + FONT_FAMILY;
        ctx.fillText(subText, centerX, centerY + bigSize * 0.55);

        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
      }

      /* ============================================================
         24. BUCLE DE JUEGO
         ============================================================ */
      let rafId = null;
      let lastTimestamp = 0;

      function loop(timestamp) {
        rafId = requestAnimationFrame(loop);

        if (lastTimestamp === 0) {
          lastTimestamp = timestamp;
          update(0);
          render();
          return;
        }

        let deltaMs = timestamp - lastTimestamp;
        lastTimestamp = timestamp;

        if (deltaMs > 100) deltaMs = 100;
        if (deltaMs < 0) deltaMs = 0;

        update(deltaMs);
        render();
      }

      function startLoop() {
        if (gameState.running) return;
        gameState.running = true;
        if (gameState.phase === 'BOOT') gameState.phase = 'READY';
        lastTimestamp = 0;
        rafId = requestAnimationFrame(loop);
      }

      function stopLoop() {
        if (!gameState.running) return;
        gameState.running = false;
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      /* ============================================================
         25. CICLO DE VIDA
         ============================================================ */
      window.addEventListener('resize', resizeCanvas, { passive: true });
      window.addEventListener('orientationchange', resizeCanvas, { passive: true });

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          stopLoop();
        } else {
          startLoop();
        }
      });

      /* ============================================================
         26. ARRANQUE
         ============================================================ */
      const START_CFG = LEVELS[gameState.currentLevelIndex];

      gameState.grid = initializeLevel(
        START_CFG.rows,
        START_CFG.cols,
        START_CFG.virusCount
      );

      console.log(
        `%c[CosmicSweeper] Nivel ${gameState.currentLevelIndex + 1}/${LEVELS.length} — ${START_CFG.rows}x${START_CFG.cols} | virus solicitados: ${START_CFG.virusCount} | virus colocados: ${countViruses(gameState.grid)}`,
        'color:#00f0ff;font-weight:bold;'
      );
      console.log('[CosmicSweeper] grid =', gameState.grid);

      updateHUD();
      resizeCanvas();
      startLoop();

    })();
  </script>
</body>
