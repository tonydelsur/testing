<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0914">
  <meta name="description" content="Portal Arcade HodoMunla: minijuegos con temática Deep Space Candy.">
  <title>HodoMunla · Portal Arcade</title>

  <link rel="stylesheet" href="./assets/css/style.css">
  <script src="./assets/js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">HodoMunla</h1>
  </header>

  <main id="game-grid" class="game-grid" aria-label="Catálogo de minijuegos">
    <article class="game-card" data-game-id="game-1">
      <h2 class="game-card__title">Asteroids Neón</h2>
      <button
        class="play-btn"
        type="button"
        data-url="./games/game-1/index.html"
        aria-label="Jugar Asteroids Neón"
      >
        Jugar
      </button>
    </article>

    <article class="game-card" data-game-id="game-2">
      <h2 class="game-card__title">Candy Runner</h2>
      <button
        class="play-btn"
        type="button"
        data-url="./games/game-2/index.html"
        aria-label="Jugar Candy Runner"
      >
        Jugar
      </button>
    </article>

    <article class="game-card" data-game-id="game-3">
      <h2 class="game-card__title">Neon Snake</h2>
      <button
        class="play-btn"
        type="button"
        data-url="./games/game-3/index.html"
        aria-label="Jugar Neon Snake"
      >
        Jugar
      </button>
    </article>
  </main>

  <div
    id="game-modal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    aria-hidden="true"
    hidden
  >
    <div class="modal__content">
      <div class="modal__header">
        <h2 id="modal-title" class="modal__title">Jugando</h2>
        <button
          id="modal-close"
          class="modal__close"
          type="button"
          aria-label="Cerrar juego"
        >
          ×
        </button>
      </div>

      <div id="game-iframe-container" class="modal__iframe-container"></div>
    </div>
  </div>
</body>
</html>
